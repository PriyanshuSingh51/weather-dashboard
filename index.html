<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Weather App</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
<div class="hero">
<h1>🌤 Weather Dashboard</h1>
<p>Real-time weather and 5-day forecast</p>
</div>

<div class="search-box">
<input id="cityInput" placeholder="Enter city name">
<button id="searchBtn">Search</button>
<button id="unitBtn">Switch to °F</button>
<button id="themeBtn">🌙 Dark Mode</button>
<button id="clearBtn">Clear</button>
</div>

<div id="weather"></div>
<div id="forecast"></div>
</div>

<script src="js/config.js"></script>
<script src="js/weatherService.js"></script>
<script src="js/app.js"></script>
</body>
</html>
